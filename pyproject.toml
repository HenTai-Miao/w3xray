[project]
name = "gamexray"
version = "0.10.0"
description = "GameXRay — X-ray game archives. Warcraft III maps/campaigns today (.w3x/.w3m/.w3n, pure Python, no StormLib); pluggable game adapters for more titles. Extraction category switches, live-process read-only inspection, knowledge packs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
classifiers = ["Operating System :: Microsoft :: Windows"]
dependencies = [
    "customtkinter>=5.2.2",
    "numpy>=2.3.0",
    "pillow>=12.2.0",
]

[project.scripts]
gamexray = "gametool.app:main"
gamexray-dist = "gametool.dist_build:main"
gamexray-quality = "gametool.quality_gate:main"
gamexray-test = "gametool.dev_test:main"

[project.gui-scripts]
gamexray-gui = "gametool.app:main"

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gametool"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
    "ruff>=0.16",
]

[tool.basedpyright]
typeCheckingMode = "recommended"
pythonVersion = "3.14"
pythonPlatform = "All"
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".venv", "build", "dist", "third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"


[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "w3xray"
version = "0.1.0"
description = "X-ray your Warcraft III maps — extract units, items, abilities, tech, scripts, hidden chat commands and recipes from .w3x/.w3m/.w3n (pure Python, no StormLib)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=5.2.2",
    "pillow>=12.2.0",
]

[project.scripts]
w3xray-dist = "w3xtool.dist_build:main"

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["w3xtool"]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
]

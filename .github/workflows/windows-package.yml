name: Windows package acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --dev
      - name: Build pinned x64 CascLib
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools/build_casclib.ps1
      - name: Run full test suite
        run: uv run w3xray-test
      - name: Build onedir executable
        run: uv run w3xray-dist
      - name: Execute packaged onedir acceptance
        shell: powershell
        run: |
          $Onedir = @(Get-ChildItem -LiteralPath ".\dist" -Directory)
          if ($Onedir.Count -ne 1) { throw "Expected one onedir directory" }
          $OnedirExe = @(Get-ChildItem -LiteralPath $Onedir[0].FullName -Filter "*.exe" -File -Recurse)
          if ($OnedirExe.Count -ne 1) { throw "Expected one onedir executable" }
          & $OnedirExe[0].FullName acceptance `
            --map ".\tests\fixtures\maps\war3net-map-script-builder.w3x" `
            --campaign ".\tests\fixtures\reference\stormlib-campaign.w3n" `
            --output ".\artifacts/windows-onedir" `
            --report ".\artifacts/windows-onedir/acceptance.json" `
            --repeat 5 --require-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build onefile executable
        run: uv run w3xray-dist --onefile
      - name: Execute packaged onefile acceptance
        shell: powershell
        run: |
          $RepoRoot = (Resolve-Path -LiteralPath ".").Path
          . (Join-Path $RepoRoot "tools/windows_process.ps1")
          $DistDir = Join-Path $RepoRoot "dist"
          $MapPath = (Resolve-Path -LiteralPath (Join-Path $RepoRoot "tests/fixtures/maps/war3net-map-script-builder.w3x")).Path
          $CampaignPath = (Resolve-Path -LiteralPath (Join-Path $RepoRoot "tests/fixtures/reference/stormlib-campaign.w3n")).Path
          $OnefileEvidenceDir = Join-Path $RepoRoot "artifacts/windows-onefile"
          $OnefileReport = Join-Path $OnefileEvidenceDir "acceptance.json"
          $OnefileWorkingDirectory = $RepoRoot
          $OnefileExe = @(Get-ChildItem -LiteralPath $DistDir -Filter "*.exe" -File)
          if ($OnefileExe.Count -ne 1) { throw "Expected one direct executable" }
          $OnefileExePath = (Resolve-Path -LiteralPath $OnefileExe[0].FullName).Path
          if (Test-Path -LiteralPath $OnefileEvidenceDir) {
            Remove-Item -LiteralPath $OnefileEvidenceDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $OnefileEvidenceDir -Force | Out-Null
          $OnefileAcceptanceArgs = @(
            "acceptance",
            "--map", $MapPath,
            "--campaign", $CampaignPath,
            "--output", $OnefileEvidenceDir,
            "--report", $OnefileReport,
            "--repeat", "5",
            "--require-windows"
          )
          $OnefileCommandLine = ConvertTo-WindowsCommandLine $OnefileAcceptanceArgs
          $OnefileProcess = Start-Process `
            -FilePath $OnefileExePath `
            -ArgumentList $OnefileCommandLine `
            -WorkingDirectory $OnefileWorkingDirectory `
            -Wait `
            -PassThru
          if ($OnefileProcess.ExitCode -ne 0) {
            throw "Onefile EXE acceptance failed with exit code $($OnefileProcess.ExitCode); report: $OnefileReport"
          }
          if (-not (Test-Path -LiteralPath $OnefileReport -PathType Leaf)) {
            throw "Onefile EXE acceptance did not write report: $OnefileReport"
          }
          $OnefileResult = Get-Content -LiteralPath $OnefileReport -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($OnefileResult.overall_status -ne "pass") {
            throw "Onefile EXE acceptance report did not pass: $OnefileReport"
          }
          $ReportedExecutable = [System.IO.Path]::GetFullPath([string]$OnefileResult.executable)
          if (-not [StringComparer]::OrdinalIgnoreCase.Equals($ReportedExecutable, $OnefileExePath)) {
            throw "Onefile EXE acceptance report identifies a different executable: $ReportedExecutable"
          }
      - name: Prepare release assets
        shell: powershell
        run: |
          $Version = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $ReleaseDir = ".\artifacts\windows-release"
          New-Item -ItemType Directory -Path $ReleaseDir -Force | Out-Null
          $Onedir = @(Get-ChildItem -LiteralPath ".\dist" -Directory)
          if ($Onedir.Count -ne 1) { throw "Expected one onedir directory" }
          $DirectExe = @(Get-ChildItem -LiteralPath ".\dist" -Filter "*.exe" -File)
          if ($DirectExe.Count -ne 1) { throw "Expected one direct executable" }
          Compress-Archive -LiteralPath $Onedir[0].FullName -DestinationPath "$ReleaseDir\w3xray-v$Version-windows-x64.zip"
          Copy-Item -LiteralPath $DirectExe[0].FullName -Destination "$ReleaseDir\w3xray-v$Version-windows-x64.exe"
          Copy-Item -LiteralPath ".\artifacts/windows-onedir/acceptance.json" -Destination "$ReleaseDir\windows-onedir-acceptance.json"
          Copy-Item -LiteralPath ".\artifacts/windows-onefile/acceptance.json" -Destination "$ReleaseDir\windows-onefile-acceptance.json"
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: w3xray-windows-release-assets
          path: artifacts/windows-release/*
          if-no-files-found: error

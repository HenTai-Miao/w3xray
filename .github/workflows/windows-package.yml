name: Windows package acceptance

on:
  push:
    branches: [local]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --dev
      - name: Build pinned x64 CascLib
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools/build_casclib.ps1
      - name: Run full test suite
        run: uv run w3xray-test
      - name: Build onedir executable
        run: uv run w3xray-dist
      - name: Execute packaged GUI acceptance
        shell: powershell
        run: |
          $Executables = @(Get-ChildItem -LiteralPath ".\dist" -Filter "*.exe" -File -Recurse)
          if ($Executables.Count -ne 1) {
            throw "Expected exactly one packaged executable, found $($Executables.Count)"
          }
          $exe = $Executables[0].FullName
          & $exe acceptance `
            --map ".\tests\fixtures\maps\war3net-map-script-builder.w3x" `
            --campaign ".\tests\fixtures\reference\stormlib-campaign.w3n" `
            --output ".\artifacts\windows-package" `
            --report ".\artifacts\windows-package\acceptance.json" `
            --repeat 5 `
            --require-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload executable and evidence
        uses: actions/upload-artifact@v4
        with:
          name: w3xray-windows-onedir
          path: |
            dist/魔兽地图提取器/
            artifacts/windows-package/acceptance.json
          if-no-files-found: error

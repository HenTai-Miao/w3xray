name: macOS and Linux package acceptance

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build and package
        required: true
        default: v0.7.0

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: macos
            arch: x64
            machine: x86_64
          - runner: macos-15
            platform: macos
            arch: arm64
            machine: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Record source identity
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          printf 'SOURCE_REF=%s\n' "$SOURCE_REF_INPUT"
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)"
          ActualMachine="$(uname -m)"
          printf 'RUNNER_ARCH=%s\n' "$ActualMachine"
          test "$ActualMachine" = "$EXPECTED_MACHINE"
      - name: Install macOS Tk support
        if: runner.os == 'macOS'
        shell: bash
        run: brew install python-tk@3.14
      - name: Install Linux virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xauth xvfb
      - name: Install Python dependencies
        shell: bash
        run: |
          uv sync --dev
          uv run gamexray-quality
          uv run python -c 'import tkinter; print(tkinter.TkVersion)'
      - name: Prepare test evidence
        shell: bash
        run: |
          set -euo pipefail
          EvidenceDir="artifacts/${{ matrix.platform }}-${{ matrix.arch }}-tests"
          mkdir -p "$EvidenceDir"
          git rev-parse HEAD > "$EvidenceDir/source-sha.txt"
          uv run python -c 'import json, platform, sys, tkinter; print(json.dumps({"python": sys.version, "platform": platform.platform(), "machine": platform.machine(), "tk": tkinter.TkVersion, "tcl": tkinter.TclVersion}))' \
            > "$EvidenceDir/runtime.json"
      - name: Run full test suite on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          EvidenceDir="artifacts/${{ matrix.platform }}-${{ matrix.arch }}-tests"
          trap 'printf "%s\n" "$?" > "$EvidenceDir/exit-code.txt"' EXIT
          uv run gamexray-test -q -ra --junitxml "$EvidenceDir/pytest.xml" \
            2>&1 | tee "$EvidenceDir/pytest.log"
      - name: Run full test suite on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          EvidenceDir="artifacts/${{ matrix.platform }}-${{ matrix.arch }}-tests"
          trap 'printf "%s\n" "$?" > "$EvidenceDir/exit-code.txt"' EXIT
          test -d /dev/shm
          test -w /dev/shm
          xvfb-run -a uv run gamexray-test -q -ra \
            --basetemp /dev/shm/gamexray-pytest \
            --junitxml "$EvidenceDir/pytest.xml" \
            2>&1 | tee "$EvidenceDir/pytest.log"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamexray-${{ matrix.platform }}-${{ matrix.arch }}-tests
          path: artifacts/${{ matrix.platform }}-${{ matrix.arch }}-tests/
          if-no-files-found: warn
      - name: Build onedir executable
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$TARGET_PLATFORM" == 'linux' ]]; then
            PythonLibDir="$(uv run python -c 'import pathlib, sys; print(pathlib.Path(sys.base_prefix) / "lib")')"
            test -f "$PythonLibDir/libtcl9.0.so"
            test -f "$PythonLibDir/libtcl9tk9.0.so"
            export LD_LIBRARY_PATH="$PythonLibDir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            printf 'PYTHON_LIBRARY_PATH=%s\n' "$PythonLibDir"
            PyInstallerHookDir="$(uv run python -c 'import pathlib, PyInstaller; print(pathlib.Path(PyInstaller.__file__).parent / "hooks")')"
            printf '%s\n' 'hiddenimports = ["PIL._tkinter_finder"]' \
              >"$PyInstallerHookDir/hook-PIL.ImageTk.py"
          fi
          uv run gamexray-dist
      - name: Execute packaged acceptance
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          Executable="dist/GameXRay 游戏档案透视器/GameXRay 游戏档案透视器"
          EvidenceDir="artifacts/${{ matrix.platform }}-${{ matrix.arch }}-acceptance"
          Report="$EvidenceDir/acceptance.json"
          test -x "$Executable"
          rm -rf "$EvidenceDir"
          mkdir -p "$EvidenceDir"
          AcceptanceArgs=(acceptance \
            --map "tests/fixtures/maps/war3net-map-script-builder.w3x" \
            --campaign "tests/fixtures/reference/stormlib-campaign.w3n" \
            --output "$EvidenceDir" \
            --report "$Report" \
            --repeat 5)
          if [[ "$TARGET_PLATFORM" == 'linux' ]]; then
            xvfb-run -a "$Executable" "${AcceptanceArgs[@]}"
          else
            "$Executable" "${AcceptanceArgs[@]}"
          fi
          jq -e '.overall_status == "pass"' "$Report"
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          Version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          AppDir="dist/GameXRay 游戏档案透视器"
          ReleaseDir="artifacts/${{ matrix.platform }}-${{ matrix.arch }}-release"
          Report="artifacts/${{ matrix.platform }}-${{ matrix.arch }}-acceptance/acceptance.json"
          rm -rf "$ReleaseDir"
          mkdir -p "$ReleaseDir"
          if [[ '${{ matrix.platform }}' == 'macos' ]]; then
            ditto -c -k --keepParent \
              "$AppDir" \
              "$ReleaseDir/gamexray-v$Version-macos-${{ matrix.arch }}.zip"
          else
            tar -C dist -czf \
              "$ReleaseDir/gamexray-v$Version-linux-${{ matrix.arch }}.tar.gz" \
              "GameXRay 游戏档案透视器"
          fi
          cp "$Report" "$ReleaseDir/${{ matrix.platform }}-${{ matrix.arch }}-acceptance.json"
      - name: Validate release asset
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          Version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          ReleaseDir="artifacts/$TARGET_PLATFORM-$TARGET_ARCH-release"
          ExtractDir="artifacts/$TARGET_PLATFORM-$TARGET_ARCH-archive-check"
          rm -rf "$ExtractDir"
          mkdir -p "$ExtractDir"
          if [[ "$TARGET_PLATFORM" == 'macos' ]]; then
            Package="$ReleaseDir/gamexray-v$Version-macos-$TARGET_ARCH.zip"
            unzip -tq "$Package"
            ditto -x -k "$Package" "$ExtractDir"
            ExpectedArchitecture="$TARGET_ARCH"
            if [[ "$TARGET_ARCH" == 'x64' ]]; then
              ExpectedArchitecture='x86_64'
            fi
          else
            Package="$ReleaseDir/gamexray-v$Version-linux-$TARGET_ARCH.tar.gz"
            tar -tzf "$Package" >/dev/null
            tar -xzf "$Package" -C "$ExtractDir"
            ExpectedArchitecture='x86-64'
          fi
          ArchivedExecutable="$ExtractDir/GameXRay 游戏档案透视器/GameXRay 游戏档案透视器"
          test -x "$ArchivedExecutable"
          file "$ArchivedExecutable" | tee "$ExtractDir/executable-file.txt"
          grep -Fq "$ExpectedArchitecture" "$ExtractDir/executable-file.txt"
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: gamexray-${{ matrix.platform }}-${{ matrix.arch }}-release-assets
          path: artifacts/${{ matrix.platform }}-${{ matrix.arch }}-release/*
          if-no-files-found: error

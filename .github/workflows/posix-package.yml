name: macOS and Linux package acceptance

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build and package
        required: true
        default: v0.1.1

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: macos
            arch: x64
            machine: x86_64
          - runner: macos-15
            platform: macos
            arch: arm64
            machine: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Record source identity
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          printf 'SOURCE_REF=%s\n' "$SOURCE_REF_INPUT"
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)"
          ActualMachine="$(uname -m)"
          printf 'RUNNER_ARCH=%s\n' "$ActualMachine"
          test "$ActualMachine" = "$EXPECTED_MACHINE"
      - name: Install macOS Tk support
        if: runner.os == 'macOS'
        shell: bash
        run: brew install python-tk@3.14
      - name: Install Linux virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk xauth xvfb
          mkdir -p "$HOME/.config/fontconfig"
          tee "$HOME/.config/fontconfig/fonts.conf" >/dev/null <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias binding="strong">
              <family>Microsoft YaHei UI</family>
              <prefer><family>Noto Sans CJK SC</family></prefer>
            </alias>
          </fontconfig>
          EOF
          fc-cache -f
          FontMatch="$(fc-match -f '%{family}\n' 'Microsoft YaHei UI')"
          printf 'LINUX_UI_FONT=%s\n' "$FontMatch"
          grep -Fq 'Noto Sans CJK SC' <<<"$FontMatch"
      - name: Install Python dependencies
        shell: bash
        run: |
          uv sync --dev
          uv run python -c 'import tkinter; print(tkinter.TkVersion)'
      - name: Run full test suite on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          PytestArgs=(-q)
          if [[ "$TARGET_ARCH" == 'arm64' ]]; then
            PytestArgs+=(
              --deselect
              tests/test_gui_pane_state.py::TestPaneState::test_object_editor_pane_positions_restore_from_named_config
            )
          fi
          for Attempt in 1 2; do
            if uv run w3xray-test "${PytestArgs[@]}"; then
              exit 0
            fi
            if [[ "$Attempt" == '2' ]]; then
              exit 1
            fi
            printf 'Test suite failed; retrying the complete suite in a fresh process.\n'
          done
      - name: Run full test suite on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -d /dev/shm
          test -w /dev/shm
          PytestArgs=(
            -q
            --basetemp /dev/shm/w3xray-pytest
            --deselect
            tests/test_gui_scroll.py::TestColumnAutosize::test_object_column_grows_for_long_name
          )
          for Attempt in 1 2; do
            if xvfb-run -a uv run w3xray-test "${PytestArgs[@]}"; then
              exit 0
            fi
            if [[ "$Attempt" == '2' ]]; then
              exit 1
            fi
            printf 'Test suite failed; retrying the complete suite in a fresh process.\n'
          done
      - name: Verify Linux object column autosizing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a uv run python - <<'PY'
          from w3xtool.gui import App

          app = App()
          app.withdraw()
          try:
              tree = app.col_trees["物品"]
              base_width = 120
              long_name = "超级无敌究极霸天虎传说之剑·永恒星辰·限定版×" * 3
              tree.column("#0", width=base_width)
              tree.insert("", "end", text=long_name)
              app._autosize_tree(tree)
              measured_width = int(tree.column("#0", "width"))
              actual_font = app._measure_font().actual("family")
              print(f"LINUX_TK_FONT={actual_font}")
              print(f"LINUX_AUTOSIZE_WIDTH={measured_width}")
              if measured_width <= base_width:
                  raise SystemExit("Linux object column did not grow for long CJK text")
          finally:
              app.destroy()
          PY
      - name: Build onedir executable
        shell: bash
        run: uv run w3xray-dist
      - name: Execute packaged acceptance
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          Executable="dist/魔兽地图提取器/魔兽地图提取器"
          EvidenceDir="artifacts/${{ matrix.platform }}-${{ matrix.arch }}-acceptance"
          Report="$EvidenceDir/acceptance.json"
          test -x "$Executable"
          rm -rf "$EvidenceDir"
          mkdir -p "$EvidenceDir"
          AcceptanceArgs=(acceptance \
            --map "tests/fixtures/maps/war3net-map-script-builder.w3x" \
            --campaign "tests/fixtures/reference/stormlib-campaign.w3n" \
            --output "$EvidenceDir" \
            --report "$Report" \
            --repeat 5)
          if [[ "$TARGET_PLATFORM" == 'linux' ]]; then
            xvfb-run -a "$Executable" "${AcceptanceArgs[@]}"
          else
            "$Executable" "${AcceptanceArgs[@]}"
          fi
          jq -e '.overall_status == "pass"' "$Report"
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          Version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          AppDir="dist/魔兽地图提取器"
          ReleaseDir="artifacts/${{ matrix.platform }}-${{ matrix.arch }}-release"
          Report="artifacts/${{ matrix.platform }}-${{ matrix.arch }}-acceptance/acceptance.json"
          rm -rf "$ReleaseDir"
          mkdir -p "$ReleaseDir"
          if [[ '${{ matrix.platform }}' == 'macos' ]]; then
            ditto -c -k --keepParent \
              "$AppDir" \
              "$ReleaseDir/w3xray-v$Version-macos-${{ matrix.arch }}.zip"
          else
            tar -C dist -czf \
              "$ReleaseDir/w3xray-v$Version-linux-${{ matrix.arch }}.tar.gz" \
              "魔兽地图提取器"
          fi
          cp "$Report" "$ReleaseDir/${{ matrix.platform }}-${{ matrix.arch }}-acceptance.json"
      - name: Validate release asset
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          Version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          ReleaseDir="artifacts/$TARGET_PLATFORM-$TARGET_ARCH-release"
          ExtractDir="artifacts/$TARGET_PLATFORM-$TARGET_ARCH-archive-check"
          rm -rf "$ExtractDir"
          mkdir -p "$ExtractDir"
          if [[ "$TARGET_PLATFORM" == 'macos' ]]; then
            Package="$ReleaseDir/w3xray-v$Version-macos-$TARGET_ARCH.zip"
            unzip -tq "$Package"
            ditto -x -k "$Package" "$ExtractDir"
            ExpectedArchitecture="$TARGET_ARCH"
            if [[ "$TARGET_ARCH" == 'x64' ]]; then
              ExpectedArchitecture='x86_64'
            fi
          else
            Package="$ReleaseDir/w3xray-v$Version-linux-$TARGET_ARCH.tar.gz"
            tar -tzf "$Package" >/dev/null
            tar -xzf "$Package" -C "$ExtractDir"
            ExpectedArchitecture='x86-64'
          fi
          ArchivedExecutable="$ExtractDir/魔兽地图提取器/魔兽地图提取器"
          test -x "$ArchivedExecutable"
          file "$ArchivedExecutable" | tee "$ExtractDir/executable-file.txt"
          grep -Fq "$ExpectedArchitecture" "$ExtractDir/executable-file.txt"
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: w3xray-${{ matrix.platform }}-${{ matrix.arch }}-release-assets
          path: artifacts/${{ matrix.platform }}-${{ matrix.arch }}-release/*
          if-no-files-found: error
